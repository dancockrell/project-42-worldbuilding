<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Project 42</title>
<style>
:root{
  --ink:#171310; --dim:#6a625c; --faint:#a79e97;
  --bg:#f6f2ec; --panel:#fffdfa; --rule:#e0d8ce; --accent:#8c2f1f;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#e9e3db; --dim:#a49a91; --faint:#6f665e;
         --bg:#14110f; --panel:#1b1714; --rule:#2e2723; --accent:#d4694f; }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 18px/1.65 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:38rem;margin:0 auto;padding:2.5rem 1.25rem 6rem}
header.top{
  max-width:38rem;margin:0 auto;padding:1.25rem 1.25rem 0;
  font:600 13px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
}
header.top a{color:var(--faint);text-decoration:none}
header.top a:hover{color:var(--accent)}
h1{font-size:2rem;line-height:1.15;margin:.6rem 0 1.2rem;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:2.6rem 0 .9rem;letter-spacing:-.005em}
h3{
  font:600 12px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:2.2rem 0 1rem;
}
p{margin:0 0 1.15rem}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
a{color:var(--accent)}
.kicker{
  font:600 12px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;
}
.lede{font-size:1.15rem;color:var(--dim);margin-bottom:2.5rem}
figure{margin:1.6rem 0 2.2rem}
figure img{width:100%;display:block;border:1px solid var(--rule);border-radius:3px}
figure.pending .plate{
  aspect-ratio:4/3;border:1px dashed var(--rule);border-radius:3px;
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,var(--rule) 9px,var(--rule) 10px);
  opacity:.5;
}
figcaption{
  font:400 13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--dim);margin-top:.6rem;
}
.bio{
  background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);
  padding:1.15rem 1.25rem .1rem;margin:0 0 2.6rem;border-radius:3px;
}
.bio p{font-size:1.02rem}
.story p:first-of-type::first-line{font-variant-caps:small-caps;letter-spacing:.02em}
.wc{
  font:400 12px/1 ui-sans-serif,system-ui,sans-serif;color:var(--faint);
  margin-top:2.5rem;text-align:right;
}
.pager{
  display:flex;justify-content:space-between;gap:1rem;
  border-top:1px solid var(--rule);padding-top:1.1rem;margin-top:1rem;
  font:600 13px/1.4 ui-sans-serif,system-ui,sans-serif;
}
.pager a{text-decoration:none}
.pager .next{margin-left:auto;text-align:right}
.faction{margin:0 0 2.8rem}
.blurb{color:var(--dim);margin-bottom:.9rem}
ul.cards{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
ul.cards li{
  display:flex;align-items:baseline;gap:.75rem;
  border-bottom:1px solid var(--rule);padding:.7rem 0;
}
ul.cards a{text-decoration:none;font-weight:600}
ul.cards a:hover{text-decoration:underline}
.meta{
  margin-left:auto;font:400 12px/1 ui-sans-serif,system-ui,sans-serif;
  color:var(--faint);letter-spacing:.06em;text-transform:uppercase;
}
.empty{color:var(--faint);font-style:italic}
</style>
</head>
<body>
<header class="top">{{CRUMB}}</header>
<main class="wrap">
{{BODY}}
</main>
</body>
</html>
